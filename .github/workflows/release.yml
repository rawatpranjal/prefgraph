name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  linux:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.target == 'aarch64' }}
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -i python3.10 -i python3.11 -i python3.12 -i python3.13
          manylinux: "2_28"
          # The x86_64 and aarch64 manylinux images ship different package
          # managers (dnf on AlmaLinux, yum on CentOS, apt on Debian). Detect
          # whichever is present so the clang-devel install works on both.
          before-script-linux: |
            if command -v dnf >/dev/null 2>&1; then dnf install -y clang-devel
            elif command -v microdnf >/dev/null 2>&1; then microdnf install -y clang-devel
            elif command -v yum >/dev/null 2>&1; then yum install -y clang-devel
            elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y libclang-dev clang
            fi
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-${{ matrix.target }}
          path: dist/*.whl

  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-macos-${{ matrix.target }}-py${{ matrix.python-version }}
          path: dist/*.whl

  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-windows-x64-py${{ matrix.python-version }}
          path: dist/*.whl

  publish:
    needs: [sdist, linux, macos, windows]
    runs-on: ubuntu-latest
    # PyPI Trusted Publishing (OIDC) - no API token needed.
    # Configured at: https://pypi.org/manage/project/prefgraph/settings/publishing/
    # Workflow: release.yml, Environment: (blank)
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*
