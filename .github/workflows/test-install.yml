name: Test Install

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to install from PyPI (defaults to the version in pyproject.toml)"
        required: false
        default: ""

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Resolve version
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(grep -E '^version' pyproject.toml | head -1 | sed -E 's/.*"(.*)".*/\1/')
          fi
          echo "Resolved version: $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Install from PyPI
        run: pip install "prefgraph[datasets]==${VERSION}"
      - name: Verify
        run: |
          python -c "
          import prefgraph
          print(f'Version: {prefgraph.__version__}')
          from prefgraph._rust_backend import HAS_RUST
          print(f'Rust backend: {HAS_RUST}')
          from prefgraph import Engine
          e = Engine(['ccei'])
          print('Engine created OK')
          # Quick smoke test with demo data
          from prefgraph import load_demo
          data = load_demo(n_users=5)
          results = e.analyze_arrays(data)
          print(f'Analyzed {len(data)} users')
          print(f'Result type: {type(results)}')
          print(f'First result: {results[0] if isinstance(results, list) else results}')
          print('ALL TESTS PASSED')
          "
