[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "prefgraph"
version = "0.5.17"
description = "Revealed preference analysis - rationality scores, efficiency indices, and utility recovery. Rust engine, Python interface."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "PrefGraph Contributors"}
]
keywords = [
    "revealed-preference",
    "economics",
    "rationality",
    "garp",
    "ccei",
    "utility-maximization",
    "choice-theory",
    "econometrics",
    "datasets",
    "benchmark"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed"
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "networkx>=3.0",
    "numba>=0.58.0",
    "polars>=0.19.0",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.7.0",
]
notebooks = [
    "jupyter>=1.0.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]
datasets = [
    "pandas>=2.0.0",
]
parquet = [
    "pyarrow>=14.0.0",
    "pandas>=2.0.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
    # Type stubs so the mypy gate resolves third-party imports in CI's fresh install.
    "scipy-stubs>=1.17; python_version >= '3.11'",
    "pandas-stubs>=2.2; python_version >= '3.11'",
    "types-networkx>=3.4; python_version >= '3.11'",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=3.0",
    "sphinx-autodoc-typehints>=1.25",
    "sphinx-copybutton>=0.5",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "polars>=0.19.0",
    "numba>=0.58.0",
    "pyarrow>=14.0.0",
]
benchmarks = [
    "pandas>=2.0.0",
    "lightgbm>=4.0.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
]
all = [
    "prefgraph[dev,viz,notebooks,docs,parquet]"
]

[project.urls]
Homepage = "https://prefgraph.readthedocs.io"
Documentation = "https://prefgraph.readthedocs.io"
Repository = "https://github.com/rawatpranjal/PrefGraph"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prefgraph = ["py.typed"]

[tool.maturin]
python-source = "src"
module-name = "prefgraph._rust_core"
manifest-path = "rust/crates/rpt-python/Cargo.toml"
features = ["pyo3/extension-module", "parquet"]
include = ["LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=prefgraph --cov-report=term-missing"
# Exclude source directory from test collection (functions like test_warp_la are not tests)
norecursedirs = ["src", "build", "dist", ".git", "references", "case_studies", "tests/simulations"]
# Only collect test functions that are in test files (not source API functions)
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Curated baseline: catch real type bugs without numpy-strict pedantry.
# We deliberately do NOT enable disallow_untyped_defs or disallow_any_generics
# globally; on a numpy-heavy scientific codebase those produce type-arg /
# no-untyped-def noise rather than signal. strict=true yielded ~830 errors,
# the overwhelming majority being "annotate every ndarray dtype" pedantry.
[tool.mypy]
python_version = "3.10"
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true
warn_unused_configs = true

# prefgraph.contrib.* is the DEPRECATED MLE/estimation package (logit/Luce,
# CRRA, Bradley-Terry, Slutsky regression, spatial ideal point). It is slated
# for removal and ships only as DeprecationWarning import shims, so we exclude
# it from type-checking entirely rather than spend effort on dead code.
[[tool.mypy.overrides]]
module = "prefgraph.contrib.*"
ignore_errors = true

# Stubless third-party dependencies with NO maintained type stubs. numba ships
# no py.typed marker and pyarrow's stubs are incomplete, so importing them as
# Any is the honest choice. scipy / pandas / networkx are handled via their
# maintained stub packages (scipy-stubs, pandas-stubs, types-networkx) instead.
[[tool.mypy.overrides]]
module = ["numba.*", "pyarrow.*"]
ignore_missing_imports = true

# prefgraph._rust_core is the compiled Rust (maturin/PyO3) extension module.
# It is a binary .so with no Python source or generated stubs, so mypy cannot
# resolve it across the FFI boundary. Suppressing the missing-import is correct.
[[tool.mypy.overrides]]
module = "prefgraph._rust_core"
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py310"
